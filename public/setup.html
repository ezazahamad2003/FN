<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FN Onboarding · Connections</title>
    <link rel="icon" type="image/png" href="/logo/image.png">
    <link rel="stylesheet" href="/styles.css">
    <script>
      /* Runs before first paint so the stored theme never flashes. Light is the
         CSS default, so this only ever has to opt in to dark. */
      (function () {
        try {
          /* Light is the product default, deliberately NOT following the OS
             preference: a first-time visitor always gets the light store form.
             Dark only ever comes from the visitor picking it here before. */
          var saved = localStorage.getItem("fnTheme");
          document.documentElement.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <!--
      Setup screen — one job: connect or disconnect Shopify + Google Drive.
      States covered: checking, connected (with store name), and missing
      (Shopify shows a store-handle input; Google links straight to OAuth).
    -->
    <main class="setup-shell">
      <section class="card card-pad setup-panel">
        <div class="setup-topline">
          <div data-theme-toggle></div>
        </div>
        <div class="brand-lockup setup-brand">
          <img class="brand-logo" src="/logo/image.png" alt="FN Simple">
          <span>
            <span class="sub">Account access</span>
            <span class="title" style="display:block">Connections</span>
          </span>
        </div>

        <h2>Connect the accounts used for onboarding runs.</h2>
        <p class="muted" style="margin-top:var(--space-2)">Both Shopify and Google Drive must be connected before you can run an onboarding.</p>

        <div class="setup-list" id="setupServices">
          <article class="service-card" data-state="checking">
            <div class="info">
              <span class="glyph" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              </span>
              <div>
                <div class="name">Shopify</div>
                <div class="state"><span class="dot"></span><span class="state-text">Checking…</span></div>
              </div>
            </div>
            <div class="actions"></div>
          </article>
        </div>

        <div class="setup-actions">
          <a class="btn btn-ghost" href="/">← Back to onboarding</a>
        </div>
      </section>
    </main>

    <script>
      const services = [
        {
          key: "shopify",
          label: "Shopify",
          glyph: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>'
        },
        {
          key: "google",
          label: "Google Drive",
          glyph: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 15 4-7h10l4 7"/><path d="m7 8 5 9"/><path d="m17 8-5 9"/><path d="M3 15h18l-4 6H7Z"/></svg>'
        }
      ];
      const setupServices = document.getElementById("setupServices");

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c];
        });
      }

      function actionFor(service, connected, store) {
        if (connected) {
          return '<button class="btn btn-danger-ghost btn-sm disconnect-service" type="button" data-service="' + service.key + '">Disconnect</button>';
        }
        if (service.key === "shopify") {
          return '<form class="shopify-connect" data-shopify-connect>' +
              '<label class="sr-only" for="shopifyStore">Shopify store handle</label>' +
              '<input id="shopifyStore" name="shop" type="text" placeholder="store-handle" autocomplete="off" required>' +
              '<button class="btn btn-secondary btn-sm" type="submit">Connect</button>' +
            '</form>';
        }
        return '<a class="btn btn-secondary btn-sm" href="/auth/' + service.key + '">Connect</a>';
      }

      function renderService(service, connected, store, googleCount) {
        var stateText = "Not connected";
        if (connected && service.key === "shopify") {
          stateText = store ? "Connected · " + escapeHtml(store) : "Connected";
        } else if (connected && service.key === "google") {
          stateText = googleCount > 1 ? "Connected · " + googleCount + " accounts (failover)" : "Connected";
        } else if (connected) {
          stateText = "Connected";
        }
        return '<article class="service-card" data-state="' + (connected ? "connected" : "missing") + '">' +
            '<div class="info">' +
              '<span class="glyph" aria-hidden="true">' + service.glyph + '</span>' +
              '<div>' +
                '<div class="name">' + service.label + '</div>' +
                '<div class="state"><span class="dot"></span><span class="state-text">' + stateText + '</span></div>' +
              '</div>' +
            '</div>' +
            '<div class="actions">' + actionFor(service, connected, store) + '</div>' +
          '</article>';
      }

      async function refreshStatus() {
        try {
          const status = await (await fetch("/health")).json();
          setupServices.innerHTML = services
            .map(function (service) {
              const connected = service.key === "shopify" ? status.shopifyConnected : status.googleConnected;
              return renderService(service, connected, status.shopifyStore || "", status.googleAccountCount || 0);
            })
            .join("");
        } catch (error) {
          setupServices.innerHTML = '<p class="muted">Could not load connection status. Refresh to try again.</p>';
        }
      }

      document.addEventListener("submit", function (event) {
        const form = event.target.closest("[data-shopify-connect]");
        if (!form) return;
        event.preventDefault();
        const shop = form.querySelector('input[name="shop"]').value.trim();
        if (shop) window.location.href = "/auth/shopify?shop=" + encodeURIComponent(shop);
      });

      document.addEventListener("click", async function (event) {
        const button = event.target.closest(".disconnect-service");
        if (!button) return;
        const service = button.dataset.service;
        const label = service === "shopify" ? "Shopify" : "Google Drive";
        if (!window.confirm("Disconnect " + label + "? You can connect a different account afterwards.")) return;

        button.disabled = true;
        try {
          const res = await fetch("/auth/" + service + "/disconnect", { method: "POST" });
          if (!res.ok) throw new Error("Disconnect failed");
          await refreshStatus();
        } catch (error) {
          window.alert("Could not disconnect " + label + ". Please try again.");
          button.disabled = false;
        }
      });

      refreshStatus();
    </script>
      <script src="/theme.js"></script>
  </body>
</html>
