<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FN Onboarding Setup</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="setup-shell">
      <section class="setup-panel">
        <div class="brand-lockup setup-brand">
          <div class="brand-mark">FN</div>
          <div>
            <p class="eyebrow">Account access</p>
            <h1>Connections</h1>
          </div>
        </div>
        <div class="setup-copy">
          <h2>Manage the accounts used for onboarding runs.</h2>
        </div>
        <div class="setup-service-list" id="setupServices">
          <article class="auth-card checking">
            <div>
              <p class="eyebrow">Shopify</p>
              <h2><span class="auth-dot"></span>Checking connection</h2>
            </div>
          </article>
          <article class="auth-card checking">
            <div>
              <p class="eyebrow">Google Drive</p>
              <h2><span class="auth-dot"></span>Checking connection</h2>
            </div>
          </article>
        </div>
        <div class="setup-actions">
          <a class="button secondary" href="/">Back to Onboarding</a>
        </div>
      </section>
    </main>
    <script>
      const services = [
        { key: "shopify", label: "Shopify" },
        { key: "google", label: "Google Drive" }
      ];
      const setupServices = document.getElementById("setupServices");

      function renderService(service, connected) {
        const statusText = connected ? "Connected and ready" : "Not connected";
        const action = connected
          ? '<button class="button ghost compact disconnect-service" type="button" data-service="' + service.key + '">Disconnect</button>'
          : '<a class="button compact" href="/auth/' + service.key + '">Connect</a>';
        return '<article class="auth-card ' + (connected ? "connected" : "missing") + '">' +
          '<div><p class="eyebrow">' + service.label + '</p>' +
          '<h2><span class="auth-dot"></span>' + statusText + '</h2></div>' +
          '<div class="auth-actions">' + action + '</div>' +
        '</article>';
      }

      async function refreshStatus() {
        const res = await fetch("/health");
        const status = await res.json();
        setupServices.innerHTML = services
          .map((service) => renderService(service, service.key === "shopify" ? status.shopifyConnected : status.googleConnected))
          .join("");
      }

      document.addEventListener("click", async (event) => {
        const button = event.target.closest(".disconnect-service");
        if (!button) return;
        const service = button.dataset.service;
        const label = service === "shopify" ? "Shopify" : "Google Drive";
        if (!window.confirm("Disconnect " + label + "? You can connect a different account after this.")) return;

        button.disabled = true;
        try {
          const res = await fetch("/auth/" + service + "/disconnect", { method: "POST" });
          if (!res.ok) throw new Error("Disconnect failed");
          await refreshStatus();
        } catch (error) {
          alert("Could not disconnect " + label + ". Please try again.");
        } finally {
          button.disabled = false;
        }
      });

      refreshStatus();
    </script>
  </body>
</html>
